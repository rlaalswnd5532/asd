<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중핵 테이블 클릭 시 목록 표시</title>
    <style>
        .container {
            display: flex;
            gap: 0;
        }
        table {
            border-collapse: collapse;
            border: 3px solid #000;
            cursor: pointer;
            width: 150px;
        }
        th {
            border: 1px solid #555;
            padding: 15px;
            text-align: center;
            background: #f0f0f0;
            font-size: 18px;
        }
        #result {
            margin-top: 30px;
            font-size: 20px;
            white-space: pre-line;
        }

        .taken {
            color: green;
            font-weight: bold;
        }
        .not-taken {
            color: gray;
        }
    </style>
</head>
<body>

<h2>중핵 카테고리 클릭 시 과목 목록 표시</h2>

<div class="container">
    <table onclick="showList(1)">
        <tr><th>자연 과학</th></tr>
    </table>

    <table onclick="showList(2)">
        <tr><th>인문</th></tr>
    </table>

    <table onclick="showList(3)">
        <tr><th>휴먼 테크</th></tr>
    </table>

    <table onclick="showList(4)">
        <tr><th>영어</th></tr>
    </table>
</div>

<div id="result">여기에 해당 중핵 카테고리의 목록이 표시됩니다</div>

<script>
    // 실제 중핵 과목 목록
    const tableData = {
        1: ["기초 과학 A", "기초 과학 B", "실험 과학 C"],
        2: ["인문학 이론", "철학 개론", "사회 이해"],
        3: ["휴먼테크 기초", "AI 이해", "디지털 리터러시"],
        4: ["English Reading", "English Writing", "English Conversation"]
    };

    // ✔ 네가 이미 수강한 과목 리스트 — 여기에 실제 들은 과목 넣으면 자동 체크됨
    const taken = [
        "기초 과학 A",
        "사회 이해",
        "English Reading"
    ];

    function showList(tableNum) {
        const categoryName = document.querySelectorAll("th")[tableNum - 1].textContent;
        const list = tableData[tableNum];

        let output = categoryName + " 목록:\n\n";

        list.forEach(item => {
            if (taken.includes(item)) {
                output += `✔ ${item}\n`;     // 초록 표시
            } else {
                output += `● ${item}\n`;     // 회색 표시
            }
        });

        document.getElementById("result").innerHTML = output
            .replace(/✔ (.*)/g, "<span class='taken'>✔ $1</span>")
            .replace(/● (.*)/g, "<span class='not-taken'>● $1</span>");
    }
</script>

</body>
</html>
